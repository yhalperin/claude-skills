<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PI Commitment Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #263042;
    --border: #334155;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --text-dim: #64748b;
    --green: #22c55e;
    --green-bg: #14532d;
    --amber: #f59e0b;
    --amber-bg: #451a03;
    --red: #ef4444;
    --red-bg: #450a0a;
    --blue: #3b82f6;
    --blue-bg: #1e3a5f;
    --indigo: #6366f1;
    --grey: #94a3b8;
    --grey-bg: #1e293b;
    --radius: 10px;
    --radius-sm: 6px;
  }
  html, body { background: var(--bg); color: var(--text); font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 14px; line-height: 1.5; min-height: 100vh; }

  /* ── Header ── */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .header-left h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .header-left p { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .badge-fetch { background: #451a03; color: #fbbf24; border: 1px solid #92400e; border-radius: 20px; padding: 4px 12px; font-size: 11px; font-weight: 600; }
  .badge-render { color: var(--text-dim); font-size: 11px; }
  select { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 13px; cursor: pointer; }
  select:focus { outline: 2px solid var(--indigo); outline-offset: 1px; }

  /* ── Main ── */
  .main { padding: 24px; max-width: 1400px; margin: 0 auto; }

  /* ── KPI row ── */
  .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .kpi-label { color: var(--text-muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .kpi-value { font-size: 32px; font-weight: 700; line-height: 1; }
  .kpi-sub { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
  .kpi-value.green { color: var(--green); }
  .kpi-value.amber { color: var(--amber); }
  .kpi-value.red { color: var(--red); }

  /* ── Section header ── */
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .section-title { font-size: 15px; font-weight: 700; }
  .count-badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; font-size: 12px; color: var(--text-muted); }

  /* ── Division Grid (summary) ── */
  .division-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .division-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; cursor: pointer; transition: border-color 0.15s, transform 0.1s; }
  .division-card:hover { border-color: var(--indigo); transform: translateY(-2px); }
  .division-card .div-name { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  .div-pct { font-size: 36px; font-weight: 800; line-height: 1; margin-bottom: 8px; }
  .div-pct.green { color: var(--green); }
  .div-pct.amber { color: var(--amber); }
  .div-pct.red { color: var(--red); }
  .progress-bar { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
  .progress-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
  .progress-fill.green { background: var(--green); }
  .progress-fill.amber { background: var(--amber); }
  .progress-fill.red { background: var(--red); }
  .div-counts { color: var(--text-muted); font-size: 12px; }

  /* ── Drill-down ── */
  .drilldown { display: none; }
  .drilldown.active { display: block; }
  .summary-view.hidden { display: none; }

  .breadcrumb { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; color: var(--text-muted); font-size: 13px; }
  .breadcrumb a { color: var(--indigo); text-decoration: none; cursor: pointer; }
  .breadcrumb a:hover { text-decoration: underline; }
  .breadcrumb-sep { color: var(--text-dim); }
  .breadcrumb-current { color: var(--text); font-weight: 600; }

  .division-stats-bar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; display: flex; align-items: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
  .ds-label { color: var(--text-muted); font-size: 12px; }
  .ds-value { font-size: 20px; font-weight: 700; }
  .ds-pct-badge { border-radius: 20px; padding: 4px 14px; font-size: 14px; font-weight: 700; }
  .ds-pct-badge.green { background: var(--green-bg); color: var(--green); }
  .ds-pct-badge.amber { background: var(--amber-bg); color: var(--amber); }
  .ds-pct-badge.red { background: var(--red-bg); color: var(--red); }

  /* ── Objective sections ── */
  .objective-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; }
  .obj-header { background: var(--surface2); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .obj-name { font-size: 14px; font-weight: 700; }
  .obj-name.unassigned { color: var(--text-dim); font-style: italic; }
  .obj-count { background: var(--indigo); color: #fff; border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 600; }
  .obj-count.unassigned { background: var(--border); color: var(--text-muted); }

  /* ── Theme rows ── */
  .theme-list { divide-y: 1px solid var(--border); }
  .theme-row { padding: 12px 20px; display: flex; align-items: flex-start; gap: 12px; border-top: 1px solid var(--border); }
  .theme-row:first-child { border-top: none; }
  .theme-id { flex-shrink: 0; }
  .theme-id a { background: var(--blue-bg); color: var(--blue); border: 1px solid #1e40af; border-radius: var(--radius-sm); padding: 2px 8px; font-size: 11px; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .theme-id a:hover { background: #1e3a5f; }
  .theme-body { flex: 1; min-width: 0; }
  .theme-title { font-size: 13px; font-weight: 600; line-height: 1.4; }
  .theme-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .finish-chip { border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .finish-chip.green { background: var(--green-bg); color: var(--green); }
  .finish-chip.amber { background: var(--amber-bg); color: var(--amber); }
  .finish-chip.red { background: var(--red-bg); color: var(--red); }
  .finish-chip.grey { background: var(--grey-bg); color: var(--grey); border: 1px solid var(--border); }

  /* ── Empty state ── */
  .empty-state { text-align: center; padding: 48px 24px; color: var(--text-muted); }
  .empty-state p { font-size: 15px; margin-bottom: 8px; }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .kpi-row { grid-template-columns: 1fr; }
    .division-grid { grid-template-columns: 1fr; }
    .header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>PI Commitment Dashboard</h1>
    <p id="header-subtitle">Loading…</p>
  </div>
  <div class="header-right">
    <label for="division-filter" style="color:var(--text-muted);font-size:12px;">Division</label>
    <select id="division-filter" onchange="applyDivisionFilter(this.value)">
      <option value="All">All Divisions</option>
    </select>
    <span class="badge-fetch" id="fetch-badge"></span>
    <span class="badge-render" id="render-badge"></span>
  </div>
</div>

<div class="main">

  <!-- KPI Row -->
  <div class="kpi-row">
    <div class="kpi-card">
      <div class="kpi-label">Total Themes</div>
      <div class="kpi-value" id="kpi-total">—</div>
      <div class="kpi-sub">across selected scope</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Committed</div>
      <div class="kpi-value green" id="kpi-committed">—</div>
      <div class="kpi-sub">commitment level = Committed</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Overall % Committed</div>
      <div class="kpi-value" id="kpi-pct">—</div>
      <div class="kpi-sub" id="kpi-pct-sub"></div>
    </div>
  </div>

  <!-- Summary View -->
  <div id="summary-view" class="summary-view">
    <div class="section-header">
      <span class="section-title">Division Commitment</span>
      <span class="count-badge" id="division-count-badge"></span>
    </div>
    <div class="division-grid" id="division-grid"></div>
  </div>

  <!-- Drill-Down View -->
  <div id="drilldown-view" class="drilldown">
    <div class="breadcrumb">
      <a onclick="showSummary()">← Summary</a>
      <span class="breadcrumb-sep">/</span>
      <span class="breadcrumb-current" id="drilldown-title"></span>
    </div>
    <div class="division-stats-bar" id="drilldown-stats"></div>
    <div id="objective-sections"></div>
  </div>

</div>

<script>
(function () {
  // ── Injected data ──
  const THEMES = __THEMES_JSON__;
  const TARGET_PI = __TARGET_PI__;
  const JIRA_FETCH_TS = __JIRA_FETCH_TS__;
  const SNAPSHOT_TS = __SNAPSHOT_TS__;
  const INITIAL_DIVISION = __INITIAL_DIVISION__;

  // ── State ──
  let currentDivision = "All";
  let currentDrilldown = null;

  // ── Boot ──
  document.getElementById("fetch-badge").textContent = "Jira Data as of " + JIRA_FETCH_TS;
  document.getElementById("render-badge").textContent = "Generated " + SNAPSHOT_TS;
  document.getElementById("header-subtitle").textContent =
    "Program Increment: " + TARGET_PI + " · Committed Themes by Division";

  // ── Divisions ──
  function getDivisions(themes) {
    const s = new Set();
    themes.forEach(t => (t.divisions || []).forEach(d => s.add(d)));
    return Array.from(s).sort();
  }

  const ALL_DIVISIONS = getDivisions(THEMES);

  // Populate dropdown
  const sel = document.getElementById("division-filter");
  ALL_DIVISIONS.forEach(d => {
    const o = document.createElement("option");
    o.value = d; o.textContent = d;
    sel.appendChild(o);
  });

  // ── Helpers ──
  function pctColor(pct) {
    if (pct >= 70) return "green";
    if (pct >= 40) return "amber";
    return "red";
  }

  function finishColor(dateStr) {
    if (!dateStr) return "grey";
    const today = new Date(); today.setHours(0,0,0,0);
    const d = new Date(dateStr); d.setHours(0,0,0,0);
    const diff = Math.floor((d - today) / 86400000);
    if (diff >= 30) return "green";
    if (diff >= 1) return "amber";
    return "red";
  }

  function finishLabel(dateStr) {
    if (!dateStr) return "No date";
    return "Due " + dateStr;
  }

  function themesForDivision(themes, division) {
    if (division === "All") return themes;
    return themes.filter(t => (t.divisions || []).includes(division));
  }

  function divisionStats(themes, division) {
    const divThemes = themesForDivision(themes, division);
    const committed = divThemes.filter(t => t.committed);
    const pct = divThemes.length === 0 ? 0 : Math.round(committed.length / divThemes.length * 100);
    return { total: divThemes.length, committed: committed.length, pct, themes: divThemes };
  }

  // ── KPI update ──
  function updateKPIs(themes) {
    const committed = themes.filter(t => t.committed);
    const pct = themes.length === 0 ? 0 : Math.round(committed.length / themes.length * 100);
    document.getElementById("kpi-total").textContent = themes.length;
    document.getElementById("kpi-committed").textContent = committed.length;
    const kpiPct = document.getElementById("kpi-pct");
    kpiPct.textContent = pct + "%";
    kpiPct.className = "kpi-value " + pctColor(pct);
    document.getElementById("kpi-pct-sub").textContent =
      committed.length + " of " + themes.length + " themes committed";
  }

  // ── Summary view ──
  function renderSummary(division) {
    const scopeThemes = themesForDivision(THEMES, division);
    updateKPIs(scopeThemes);

    const grid = document.getElementById("division-grid");
    grid.innerHTML = "";

    let divisionsToShow;
    if (division === "All") {
      divisionsToShow = ALL_DIVISIONS;
    } else {
      divisionsToShow = [division];
    }

    document.getElementById("division-count-badge").textContent =
      divisionsToShow.length + " division" + (divisionsToShow.length !== 1 ? "s" : "");

    divisionsToShow.forEach(div => {
      const stats = divisionStats(THEMES, div);
      const color = pctColor(stats.pct);
      const card = document.createElement("div");
      card.className = "division-card";
      card.innerHTML = `
        <div class="div-name">${escHtml(div)}</div>
        <div class="div-pct ${color}">${stats.pct}%</div>
        <div class="progress-bar">
          <div class="progress-fill ${color}" style="width:${stats.pct}%"></div>
        </div>
        <div class="div-counts">${stats.committed} committed / ${stats.total} total</div>
      `;
      card.onclick = () => showDrilldown(div);
      grid.appendChild(card);
    });
  }

  // ── Drill-down view ──
  function renderDrilldown(division) {
    document.getElementById("drilldown-title").textContent = division;

    const stats = divisionStats(THEMES, division);
    const color = pctColor(stats.pct);

    const statsBar = document.getElementById("drilldown-stats");
    statsBar.innerHTML = `
      <div><div class="ds-label">Division</div><div class="ds-value">${escHtml(division)}</div></div>
      <div><div class="ds-label">Committed</div><div class="ds-value">${stats.committed}</div></div>
      <div><div class="ds-label">Total</div><div class="ds-value">${stats.total}</div></div>
      <div><span class="ds-pct-badge ${color}">${stats.pct}% Committed</span></div>
    `;

    // Only show committed themes in drill-down
    const committedThemes = stats.themes.filter(t => t.committed);

    // Group by objectiveName
    const byObj = {};
    committedThemes.forEach(t => {
      const key = t.objectiveName || "__unassigned__";
      if (!byObj[key]) byObj[key] = [];
      byObj[key].push(t);
    });

    // Sort objectives: named ones first (alphabetical), unassigned last
    const objKeys = Object.keys(byObj)
      .filter(k => k !== "__unassigned__")
      .sort();
    if (byObj["__unassigned__"]) objKeys.push("__unassigned__");

    const container = document.getElementById("objective-sections");
    container.innerHTML = "";

    if (committedThemes.length === 0) {
      container.innerHTML = `<div class="empty-state"><p>No committed themes for this division.</p></div>`;
      return;
    }

    objKeys.forEach(objKey => {
      const isUnassigned = objKey === "__unassigned__";
      const label = isUnassigned ? "Unassigned" : objKey;
      const themes = byObj[objKey];

      const section = document.createElement("div");
      section.className = "objective-section";

      const header = document.createElement("div");
      header.className = "obj-header";
      header.innerHTML = `
        <span class="obj-name ${isUnassigned ? 'unassigned' : ''}">${escHtml(label)}</span>
        <span class="obj-count ${isUnassigned ? 'unassigned' : ''}">${themes.length} theme${themes.length !== 1 ? 's' : ''}</span>
      `;
      section.appendChild(header);

      const list = document.createElement("div");
      list.className = "theme-list";

      themes.forEach(t => {
        const fColor = finishColor(t.finishDate);
        const fLabel = finishLabel(t.finishDate);
        const row = document.createElement("div");
        row.className = "theme-row";
        row.innerHTML = `
          <div class="theme-id"><a href="${escHtml(t.url)}" target="_blank" rel="noopener">${escHtml(t.id)}</a></div>
          <div class="theme-body">
            <div class="theme-title">${escHtml(t.title)}</div>
            <div class="theme-meta">
              <span class="finish-chip ${fColor}">${escHtml(fLabel)}</span>
            </div>
          </div>
        `;
        list.appendChild(row);
      });

      section.appendChild(list);
      container.appendChild(section);
    });
  }

  // ── Navigation ──
  function showSummary() {
    currentDrilldown = null;
    document.getElementById("summary-view").classList.remove("hidden");
    document.getElementById("drilldown-view").classList.remove("active");
    renderSummary(currentDivision);
  }

  function showDrilldown(division) {
    currentDrilldown = division;
    document.getElementById("summary-view").classList.add("hidden");
    document.getElementById("drilldown-view").classList.add("active");
    renderDrilldown(division);
    updateKPIs(themesForDivision(THEMES, division));
  }

  window.showSummary = showSummary;
  window.showDrilldown = showDrilldown;

  window.applyDivisionFilter = function(division) {
    currentDivision = division;
    sel.value = division;
    if (currentDrilldown) {
      // If in drill-down and current division changes, go back to summary
      showSummary();
    } else {
      renderSummary(division);
    }
  };

  // ── Escape HTML ──
  function escHtml(s) {
    if (s == null) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // ── Initial render ──
  if (INITIAL_DIVISION && INITIAL_DIVISION !== "All") {
    currentDivision = INITIAL_DIVISION;
    sel.value = INITIAL_DIVISION;
    showDrilldown(INITIAL_DIVISION);
  } else {
    renderSummary("All");
  }
})();
</script>
</body>
</html>
